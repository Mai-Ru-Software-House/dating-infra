# HTTPS not enabled (no certificate): the API answers on plain HTTP on port 80 only.
# This is the default of docker-compose.prod.yaml, and what scripts/install selects when
# nginx/certs/ has no cert.crt and cert.key. The Android release build talks plain HTTP.
events {}

http {
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/api-proxy.inc;
    }

    # Container health check only: bound to the loopback address inside the container and
    # never published
    server {
        listen 127.0.0.1:8081;

        location = /api/v1/health {
            proxy_pass http://api:3000;
        }
    }
}
