# HTTPS enabled: port 80 redirects to HTTPS and port 443 serves the API with the certificate
# in nginx/certs/ (cert.crt and cert.key). scripts/install selects this file when both exist.
# Without a certificate Nginx cannot start with it: use nginx.prod.http.conf instead.
events {}

http {
    server_tokens off;

    # One name for every host: the server's address is not known until install time
    server {
        listen 80 default_server;
        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/api-proxy.inc;
    }

    # Container health check only: bound to the loopback address inside the container and
    # never published, so it works while port 80 redirects
    server {
        listen 127.0.0.1:8081;

        location = /api/v1/health {
            proxy_pass http://api:3000;
        }
    }
}
