services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public
      - internal

  api:
    image: ${BACKEND_IMAGE}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/dating_app

      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

      MATCH_ENGINE_URL: ${MATCH_ENGINE_URL:-http://match-engine:8000}
      
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}

      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-mairu-photos}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}

      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MATCH_ENGINE_TIMEOUT_MS: ${MATCH_ENGINE_TIMEOUT_MS:-5000}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  match-engine:
    image: ${MATCH_ENGINE_IMAGE}
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: 8000

      BACKEND_URL: ${BACKEND_URL:-http://api:3000}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  postgres:
    image: postgres:18
    security_opt:
      - "no-new-privileges:true"
    # The entrypoint needs CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETGID and SETUID to fix
    # the data directory and switch to the postgres user, so only the rest is dropped
    cap_drop:
      - AUDIT_WRITE
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    environment:
      POSTGRES_DB: dating_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "dating_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Accepted (KICS INFO, false positive): the rule flags every named volume,
      # but postgres-data is only used by this service
      # kics-scan ignore-line
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

  rustfs:
    image: rustfs/rustfs:latest
    security_opt:
      - "no-new-privileges:true"
    # Runs as the non-root user rustfs and only binds ports above 1024
    cap_drop:
      - ALL
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Accepted (KICS INFO, false positive): the rule flags every named volume,
      # but rustfs-data is only used by this service
      # kics-scan ignore-line
      - rustfs-data:/data
    networks:
      - internal

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    # Keeps only DAC_OVERRIDE: watchtower runs as root and must read the mounted
    # ~/.docker/config.json, which is usually mode 600 and owned by the host user
    cap_drop:
      - AUDIT_WRITE
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Accepted (KICS HIGH): watchtower needs the Docker socket to restart dev containers
      # when new images are pushed. Dev only, prod has no watchtower.
      # kics-scan ignore-line
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-30}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    networks:
      - internal

volumes:
  postgres-data:
  rustfs-data:

networks:
  public:
    name: dating-public
  internal:
    name: dating-internal
