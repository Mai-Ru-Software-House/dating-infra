services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public
      - internal

  api:
    image: ${BACKEND_IMAGE}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/dating_app

      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

      MATCH_ENGINE_URL: ${MATCH_ENGINE_URL:-http://match-engine:8000}
      
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}

      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-mairu-photos}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}

      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MATCH_ENGINE_TIMEOUT_MS: ${MATCH_ENGINE_TIMEOUT_MS:-5000}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  match-engine:
    image: ${MATCH_ENGINE_IMAGE}
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: 8000

      BACKEND_URL: ${BACKEND_URL:-http://api:3000}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dating_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - internal

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-30}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    networks:
      - internal

volumes:
  postgres-data:
  rustfs-data:

networks:
  public:
    name: dating-public
  internal:
    name: dating-internal
